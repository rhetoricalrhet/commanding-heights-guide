<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@1&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* 1200x630 Open Graph card, rendered to social-card.png by build.sh */
html,body{margin:0;background:#fff}
.card{width:1200px;height:630px;box-sizing:border-box;padding:56px 80px;display:grid;grid-template-rows:auto 1fr auto;color:#1f2428;font-family:"EB Garamond",Georgia,serif;position:relative}
.top{display:flex;justify-content:space-between;font-family:"Source Sans 3",Arial,sans-serif;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#8a9298}
.top b{color:#2b6a55;font-weight:600}
.mid{display:grid;place-items:center;text-align:center;align-content:center;gap:10px}
.the{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:64px;line-height:.7}
h1{margin:0;font-weight:500;font-size:112px;line-height:.95;letter-spacing:.02em}
.sub{font-variant-caps:all-small-caps;letter-spacing:.2em;font-size:30px;color:#2b6a55;margin-top:14px}
.rule{width:64px;height:1px;background:#2b6a55;margin:6px auto 0}
.bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:24px;color:#5a636a;border-top:1px solid #dde1e4;padding-top:18px}
.bot i{color:#1f2428}
.bot span{font-family:"Source Sans 3",Arial,sans-serif;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#8a9298}
svg{position:absolute;right:80px;top:110px;opacity:.9}
</style></head><body>
<div class="card">
  <div class="top"><span><b>A reader's companion</b> · by Rhet Porter</span><span>Unofficial · not by the authors</span></div>
  <div class="mid">
    <span class="the">the</span>
    <h1>COMMANDING<br>HEIGHTS</h1>
    <div class="rule"></div>
    <div class="sub">The argument, the evidence, the vocabulary</div>
  </div>
  <div class="bot"><div>An illustrated guide to the essay by <i>Will Manidis &amp; Joe Roberts</i></div><span>14 figures · read or listen</span></div>
</div>
</body></html>
